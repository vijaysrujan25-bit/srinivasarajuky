<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Srinivasa</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Srinivasa<span>.</span></a>
        <button class="hamburger"><i class="fas fa-bars"></i></button>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="education.html">Education</a></li>
            <li><a href="certifications.html">Certifications</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <section class="section-container" style="padding-top: 8rem;">
        <h2 class="section-title">Get In Touch</h2>
        
        <div class="contact-container">
            <div class="contact-info">
                <div class="contact-item">
                    <div class="contact-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div>
                        <h3 style="margin-bottom: 0.2rem;">Email Me</h3>
                        <a href="mailto:srinivasa@example.com" style="color: var(--text-secondary);">srinivasa@example.com</a>
                    </div>
                </div>
                
                <div class="contact-item">
                    <div class="contact-icon">
                        <i class="fas fa-phone"></i>
                    </div>
                    <div>
                        <h3 style="margin-bottom: 0.2rem;">Call Me</h3>
                        <p style="color: var(--text-secondary);">+1 234 567 890</p>
                    </div>
                </div>
                
                <div class="contact-item">
                    <div class="contact-icon">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <div>
                        <h3 style="margin-bottom: 0.2rem;">Location</h3>
                        <p style="color: var(--text-secondary);">City, Country</p>
                    </div>
                </div>
                
                <div style="margin-top: 2rem;">
                    <h3>Follow Me</h3>
                    <div class="card-links" style="margin-top: 1rem; gap: 1.5rem;">
                        <a href="#" style="font-size: 1.5rem;"><i class="fab fa-linkedin"></i></a>
                        <a href="#" style="font-size: 1.5rem;"><i class="fab fa-github"></i></a>
                        <a href="#" style="font-size: 1.5rem;"><i class="fab fa-twitter"></i></a>
                    </div>
                </div>
            </div>
            
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" class="form-control" placeholder="Your Message" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 1rem; width: 100%;">Send Message</button>
            </form>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
